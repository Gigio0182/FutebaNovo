<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>App Futeba Domingo | Cadastro de Atletas</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body data-group="domingo" data-back-link="/domingo/athletes">
    <main class="container">
      <header class="hero ranking-hero">
        <h1>Cadastro de Atletas - Domingo</h1>
        <p>Edite manualmente gols, jogos, assistências, MVP, pior em campo e remova atletas quando necessário.</p>
        <div class="hero-actions">
          <a class="btn secondary" href="/domingo/confirmados">Importar Lista</a>
          <a class="btn secondary" href="/domingo/partidas">Ver Partidas</a>
          <span id="sync-state" class="sync-pill"></span>
        </div>
        <button id="logout-btn" class="corner-login-btn corner-logout-btn" type="button" title="Sair" aria-label="Sair">Sair</button>
      </header>

      <section class="card">
        <h2>Novo Atleta</h2>
        <form id="athlete-form" class="grid-form" autocomplete="off">
          <label class="confirmados-field">
            Nome do atleta
            <input id="athlete-name" type="text" maxlength="60" placeholder="Exemplo: Otavio" required autocapitalize="words" spellcheck="false" />
          </label>
          <button class="btn" type="submit">Cadastrar atleta</button>
        </form>
      </section>

      <section class="card">
        <h2>Editar Atletas</h2>
        <label class="search-row">
          Buscar atleta
          <input id="athlete-search" type="search" placeholder="Digite um nome" />
        </label>
        <div id="athletes-list" class="athletes-list"></div>
      </section>

      <p id="status" class="status" aria-live="polite"></p>
    </main>

    <script src="/athletes-domingo.js"></script>
    <script src="/pwa.js"></script>
  </body>
</html>
